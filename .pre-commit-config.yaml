exclude: "node_modules|.git"
default_stages: [ pre-commit ]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "timeclock.*"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  # ssort to sort methods source files
  - repo: https://github.com/bwhmather/ssort
    rev: 0.16.0
    hooks:
      - id: ssort
        # Exclude auto-generated Frappe DocType files
        exclude: "/doctype/[^/]+/[^/]+\\.py$"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: [ "--select=I", "--fix" ]
        # exclude the legacy job_timeclock files
        exclude: "^timeclock/www/job_timeclock/.*$"

      - id: ruff
        name: "Run ruff linter"
        # exclude the legacy job_timeclock files
        exclude: "^timeclock/www/job_timeclock/.*$"

      - id: ruff-format
        name: "Run ruff formatter"
        # exclude the legacy job_timeclock files
        exclude: "^timeclock/www/job_timeclock/.*$"

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.60.0
    hooks:
      - id: oxlint
        verbose: true

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        language: node
        entry: oxfmt
        args: [ "--no-error-on-unmatched-pattern" ]
        types_or: [ javascript, ts, vue ]
        exclude: |
          (?x)^(
              timeclock/public/dist/.*|
              .*node_modules.*|
              timeclock/templates/includes/.*|
              timeclock/public/js/lib/.*|
              timeclock/www/job_timeclock/.*
          )$
        additional_dependencies: [ "oxfmt@^0.48.0" ]

ci:
  autoupdate_schedule: weekly
  skip: []
  submodules: false
