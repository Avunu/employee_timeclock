[project]
name = "employee_timeclock"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "Badge-scan timeclock kiosks and job-card time tracking for ERPNext and HRMS"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = ["getmac", "pydantic>=2.12.5", "PyJWT>=2.13,<3"]

[dependency-groups]
dev = ["pydantic-to-typescript>=2.0.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = ["E501", "W191"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]
# The legacy job timeclock page is replaced by www/job_timeclock and is deleted in a follow-up
# refactor PR; its findings (unused imports, bare excepts, an undefined `_`) are left until then.
"employee_timeclock/www/job_timeclock_legacy/*" = [
	"E402",
	"E722",
	"F401",
	"F811",
	"F821",
	"F841",
	"PERF401",
	"RUF059",
	"SIM105",
	"SIM113",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16
siblings = ["erpnext", "hrms"]
generated = [
	"components.d.ts",
	"employee_timeclock/public/js/job_timeclock/components.d.ts",
	"employee_timeclock/public/js/job_timeclock/types.ts",
	"employee_timeclock/www/job_timeclock_legacy/index.css",
	"employee_timeclock/www/job_timeclock_legacy/index.js",
]

[tool.frappe-nix.js.oxfmt]
# oxfmt parses the Jinja {{ colocated_js }} placeholder as JS blocks and breaks the page.
ignore = ["employee_timeclock/www/job_timeclock_legacy/index.html"]

[tool.frappe-nix.js.oxlint]
# The legacy job timeclock page is replaced by the job_timeclock SPA and is deleted in a follow-up refactor PR.
ignore = ["employee_timeclock/www/job_timeclock_legacy/**"]

# These SPA modules import stylesheets for Vite to bundle.
[[tool.frappe-nix.js.oxlint.overrides]]
files = [
	"employee_timeclock/public/js/job_timeclock/components/Column.vue",
	"employee_timeclock/public/js/job_timeclock/job_timeclock.ts",
	"employee_timeclock/public/js/timeclock/timeclock.ts",
]

[tool.frappe-nix.js.oxlint.overrides.rules]
"import/no-unassigned-import" = "off"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.authenticate_employee"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.log_in_employee"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.log_out_employee"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.get_work_orders"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.get_job_cards"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.sort_jobcard_by_workstation"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.log_end_time_of_jobcard"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.check_all_job_cards"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.log_start_time_of_jobcard"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.check_for_erp_log_in"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.untested]]
target = "employee_timeclock.www.job_timeclock_legacy.submit_jobcard"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.coverage-omit]]
glob = "*/www/job_timeclock_legacy/*"
reason = "Legacy job timeclock page, replaced by www/job_timeclock and deleted in a follow-up refactor PR"

[[tool.frappe-nix.typescript.spa]]
root = "."
include = [
	"employee_timeclock/public/js/FrappeCall.ts",
	"employee_timeclock/public/js/timeclock/**",
	"employee_timeclock/public/js/job_timeclock/**",
	"employee_timeclock/public/js/types/**",
	"employee_timeclock/www/job_timeclock_legacy/**",
]
tsconfig = "tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit -p tsconfig.json"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["employee_timeclock"]
# The legacy job timeclock page is replaced by www/job_timeclock and is deleted in a follow-up refactor PR.
exclude = ["employee_timeclock/www/job_timeclock_legacy"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*", "*/www/job_timeclock_legacy/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 80

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/", ".devenv/", ".direnv/"]

[tool.test_utils.static-analysis]
# timeclock.*: the old dotted paths the rename shim in hooks.py maps to their new ones;
# they name no module on purpose. Drop it with the shim.
whitelist = ["frappe.*", "erpnext.*", "hrms.*", "timeclock.*"]
