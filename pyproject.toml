[project]
name = "employee_timeclock"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "Badge-scan timeclock kiosks and job-card time tracking for ERPNext and HRMS"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = ["getmac", "pydantic>=2.12.5", "PyJWT>=2.13,<3"]

[dependency-groups]
dev = ["pydantic-to-typescript>=2.0.0"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"
hrms = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = ["E501", "W191"]
typing-modules = ["frappe.types.DF"]

[tool.ruff.lint.per-file-ignores]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16
siblings = ["erpnext", "hrms"]
integration-branch = "main"
generated = [
	"components.d.ts",
	"employee_timeclock/public/js/job_timeclock/components.d.ts",
	"employee_timeclock/www/job_timeclock/src/types.ts",
]

[tool.frappe-nix.js.oxfmt]
# oxfmt parses Jinja ({{ colocated_js }}, {% include %}, {# #}) as HTML and JS and breaks the page.
ignore = [
	"employee_timeclock/www/timeclock/index.html",
	"employee_timeclock/www/job_timeclock/index.html",
	"employee_timeclock/templates/includes/kiosk_head.html",
]

[tool.frappe-nix.js.oxlint]
# These SPA modules import stylesheets for Vite to bundle.
[[tool.frappe-nix.js.oxlint.overrides]]
files = [
	"employee_timeclock/public/js/job_timeclock/components/Column.vue",
	"employee_timeclock/public/js/job_timeclock/job_timeclock.ts",
]

[tool.frappe-nix.js.oxlint.overrides.rules]
"import/no-unassigned-import" = "off"

[[tool.frappe-nix.typescript.spa]]
root = "."
include = [
	"employee_timeclock/public/js/FrappeCall.ts",
	"employee_timeclock/public/js/job_timeclock/**",
	"employee_timeclock/public/js/types/**",
]
tsconfig = "tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit -p tsconfig.json"

# The React kiosks (www/timeclock, www/job_timeclock), built by frappe's esbuild, and their service worker.
[[tool.frappe-nix.typescript.spa]]
root = "."
include = [
	"employee_timeclock/public/js/timeclock.bundle.ts",
	"employee_timeclock/public/js/kiosk/**",
	"employee_timeclock/public/js/kiosk-sw.js",
	"employee_timeclock/www/timeclock/src/**",
	"employee_timeclock/public/js/job-timeclock.bundle.ts",
	"employee_timeclock/www/job_timeclock/src/**",
]
tsconfig = "tsconfig.react.json"
check = "tsc -p tsconfig.react.json"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["employee_timeclock"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 80

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/", ".devenv/", ".direnv/"]

[tool.test_utils.static-analysis]
# timeclock.*: the old dotted paths the rename shim in hooks.py maps to their new ones;
# they name no module on purpose. Drop it with the shim.
whitelist = ["frappe.*", "erpnext.*", "hrms.*", "timeclock.*"]
