<!DOCTYPE html>
<html>
<head>
    <!-- Include CSS stylesheets and other necessary libraries -->
    <!-- ... -->

    <!-- Include Tempus Dominus Bootstrap 4 CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tempusdominus-bootstrap-4/5.39.0/css/tempusdominus-bootstrap-4.min.css">
</head>
<body>
    <div class="tempus-dominus-container">
        <div class="input-group date" id="datetimepicker" data-target-input="nearest">
            <input type="text" class="form-control datetimepicker-input manual-time-picker" data-toggle="datetimepicker"
                data-target="#datetimepicker" required>
            <div class="input-group-append" data-target="#datetimepicker" data-toggle="datetimepicker">
                <div class="input-group-text"><i class="fa fa-calendar"></i></div>
            </div>
        </div>
    </div>

    <!-- Include Moment.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>
    <!-- Include Popper.js -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <!-- Include Tempus Dominus Bootstrap 4 JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tempusdominus-bootstrap-4/5.39.0/js/tempusdominus-bootstrap-4.min.js" integrity="sha256-3wGK8Wgpxozrpl8JvMwvz9vSmxboHt1DC7FPTZ37BiQ=" crossorigin="anonymous"></script>

    <!-- Your own custom JavaScript code -->
    <script>
        // Add your JavaScript code here
        const manualTimePicker = new tempusDominus.TempusDominus(
            document.querySelector(".manual-time-picker"),
            {
                display: {
                    viewMode: "clock",
                    theme: "light",
                    icons: {
                        up: "octicon octicon-chevron-up",
                        down: "octicon octicon-chevron-down",
                    },
                    components: {
                        decades: false,
                        year: false,
                        month: false,
                        date: false,
                        hours: true,
                        minutes: true,
                        seconds: false,
                    },
                },
            }
        );
        // Set the default time to now
        manualTimePicker.setDate(new Date());
    </script>
</body>
</html>
