<div>
	<h3>Jobs</h3>
	<div class="open-activities job-cards">
		<!-- for each job in jobs -->
		<!-- make a card for each job, showing name, description, and status -->
		<!-- use frappe classes so dark mode and light mode will still work -->
		{% for job in jobs %}
			<div class="card job-card">
				<div class="card-body">
					<h5 class="card-title">{{ job.name }}</h5>
					<h6 class="card-subtitle mb-2 text-muted">{{ job.description }}</h6>
					<p class="card-text">{{ job.status }}</p>
				</div>
			</div>
		{% endfor %}
	</div>
</div>

<style>
    /* on hover over the card, change cursor to pointer */
    .job-card:hover {
        cursor: pointer;
    }
	.job-card {
		height: 6.5rem;
	}
    .card {
        color: var(--text-color);
        background-color: var(--bg-color);
        border: 2px solid var(--border-color);
    }
    .job-cards {
		/* limit the height and make a vertical scroll bar */
		max-height: 80vh;
		overflow-y: scroll;
		
    }
</style>
