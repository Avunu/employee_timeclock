<div>
	<h3>Tasks</h3>
	<div class="open-activities task-cards">
		<!-- for each task show a card with the task name -->
		<!-- and a checkbox to mark the task as complete -->
		{% for task in tasks %}
		<div class="card task-card">
			<div class="card-body task-card-body">
				<h5 class="card-title">{{ task.operation }}</h5>
				<div class="task-card-contents">
					<h4 class="time-taken"></h4>
					<button class="start-stop-button start-button btn-btn active-btn">Start</button>
					<button class="finish-button btn-btn active-btn">Finish</button>
				</div>
			</div>
		</div>
		{% endfor %}
	</div>
</div>
<style>
	.time-taken {
		margin-bottom: 0;
	}
	.card {
		color: var(--text-color);
		background-color: var(--bg-color);
		border: 2px solid var(--border-color);
	}

	.task-card {
		height: 6.5rem
	}

	.task-cards {
		/* limit the height and make a vertical scroll bar */
		box-sizing: border-box;
		max-height: 80vh;
		overflow-y: scroll;
	}

	.task-card-body {
		/* make the card body a flex box */
		display: flex;
		flex-direction: row;
		justify-content: space-between;
		align-items: center;
	}

	.task-card-contents {
		/* make the card contents a flex box */
		display: flex;
		flex-direction: row;
		justify-content: space-between;
		align-items: center;
		gap: 3rem;
		padding: 0 1rem;
	}

	.btn-btn {
		/* style reset because there are weird things coming from frappe */
		all: unset;
		/* make the button big */
		transform: scale(1.5);
		/* rounded corners */
		border-radius: 5px;
		background-color: grey;
		padding: .5rem;
		width: 3rem;
		text-align: center;
	}

	.inactive-btn {
		/* greyed out */
		opacity: 0.5;
	}

	.inactive-btn:hover {
		cursor: default;
	}

	/* .start-button {
		background-color: #3e8e41;
	}
	.finish-button {
		background-color: #006080;
	}
	.start-button.active-btn:hover {
		background-color: #4CAF50;
	}
	.finish-button.active-btn:hover {
		background-color: #008CBA;
	}
	.stop-button {
		background-color: #f44336;
	}
	.stop-button:hover {
		background-color: #d32f2f;
	} */
	:root {
		--start-button-color: #3e8e41;
		--start-button-hover-color: #6bbf67;
		--start-button-text-color-light: #000000;
		--start-button-text-color-dark: #ffffff;

		--finish-button-color: #006080;
		--finish-button-hover-color: #00a3d1;
		--finish-button-text-color-light: #000000;
		--finish-button-text-color-dark: #ffffff;

		--stop-button-color: #f44336;
		--stop-button-hover-color: #ff6659;
		--stop-button-text-color-light: #000000;
		--stop-button-text-color-dark: #ffffff;
	}

	.start-button,
	.finish-button,
	.stop-button {
		color: var(--start-button-text-color-light);
		/* Light mode text color */
	}

	.start-button {
		background-color: var(--start-button-color);
	}

	.finish-button {
		background-color: var(--finish-button-color);
	}

	.stop-button {
		background-color: var(--stop-button-color);
	}

	.start-button:hover {
		background-color: var(--start-button-hover-color);
	}

	.finish-button.active-btn:hover {
		background-color: var(--finish-button-hover-color);
	}

	.stop-button:hover {
		background-color: var(--stop-button-hover-color);
	}

	/* Dark mode styles */
	@media (prefers-color-scheme: dark) {

		.start-button,
		.finish-button,
		.stop-button {
			color: var(--start-button-text-color-dark);
			/* Dark mode text color */
		}
	}
</style>
