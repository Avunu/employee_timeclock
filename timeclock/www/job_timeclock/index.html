<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="/assets/timeclock/dist/js/job_timeclock/index.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jobs Timeclock App</title>
</head>

<body>
    <div id="app"></div>
    <div id="modals"></div>
    <div id="popovers"></div>

    <script>window.csrf_token = '{{ csrf_token }}'</script>
    <script type="module" src="/assets/timeclock/dist/js/job_timeclock/index.js"></script>
    {% if developer_mode %}
    <script>
    (function () {
      var last = null;
      function poll() {
        fetch('/assets/timeclock/dist/js/job_timeclock/build-stamp.json?_=' + Date.now(), { cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (d) {
            if (last !== null && d.ts !== last) { window.location.reload(); }
            last = d.ts;
          })
          .catch(function () {})
          .finally(function () { setTimeout(poll, 1500); });
      }
      poll();
    })();
    </script>
    {% endif %}
</body>

</html>
